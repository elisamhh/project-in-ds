<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image coding</title>
<style>
  :root { --bg:#e8eaed; --ink:#1c1e21; --muted:#5f6368; --frame:#202124; --line:#bfc3c8; --pick:#1c1e21; --pickink:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17181a; --ink:#e8eaed; --muted:#9aa0a6; --line:#3c4043; --pick:#e8eaed; --pickink:#17181a; } }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:880px; margin:0 auto; padding:20px 16px 40px; }
  [hidden] { display:none !important; }
  h1 { font-size:1.4rem; margin:8vh 0 .5rem; }
  p { margin:.4rem 0 1rem; color:var(--muted); max-width:60ch; }
  input[type=text] { font:inherit; padding:.6rem .8rem; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; width:16rem; max-width:100%; }
  button { font:inherit; cursor:pointer; }
  .go { padding:.6rem 1.2rem; border:0; border-radius:6px; background:var(--pick); color:var(--pickink); margin-left:.5rem; }
  .go:disabled { opacity:.35; cursor:not-allowed; }
  .top { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:.9rem; margin-bottom:8px; }
  .bar { height:4px; background:var(--line); border-radius:2px; overflow:hidden; margin-bottom:16px; }
  .bar i { display:block; height:100%; width:0; background:var(--ink); }
  .frame { background:var(--frame); border-radius:8px; width:fit-content; max-width:100%; margin:0 auto; }
  .frame img { display:block; max-width:100%; max-height:62vh; object-fit:contain; }
  h2 { font-size:1.15rem; margin:20px 0 12px; font-weight:600; }
  .opts { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .opt { padding:.9rem .5rem; border:1.5px solid var(--line); background:transparent; color:inherit; border-radius:8px; }
  .opt:hover { border-color:var(--ink); }
  .opt[aria-pressed=true] { background:var(--pick); color:var(--pickink); border-color:var(--pick); }
  .opt kbd { opacity:.55; font:inherit; font-size:.8rem; margin-right:.4rem; }
  .actions { display:flex; justify-content:space-between; align-items:center; margin-top:16px; }
  .actions .go { margin:0; }
  .back { background:none; border:0; color:var(--muted); text-decoration:underline; padding:.6rem 0; }
  .note { color:var(--muted); font-size:.85rem; }
  button:focus-visible,input:focus-visible { outline:3px solid #8ab4f8; outline-offset:2px; }
  @media (max-width:520px) { .opts { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <section id="login">
    <h1>Image coding</h1>
    <p>Enter the coder ID you were given. If you have started before, you will continue where you stopped.</p>
    <input id="coder" type="text" placeholder="Coder ID" autocomplete="off">
    <button class="go" id="start">Start</button>
    <p id="loginErr" class="note"></p>
  </section>

  <section id="task" hidden>
    <div class="top"><span id="count"></span><span id="sync" class="note"></span></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="frame"><img id="img" alt="Image to code"></div>
    <p id="imgErr" class="note" hidden></p>
    <h2 id="q"></h2>
    <div class="opts" id="opts" role="group" aria-labelledby="q"></div>
    <div class="actions">
      <button class="back" id="back" hidden>Previous image</button>
      <span></span>
      <button class="go" id="next" disabled>Save and continue</button>
    </div>
    <p class="note">Keyboard: 1, 2, 3 to choose, Enter to continue.</p>
  </section>

  <section id="done" hidden>
    <h1>All images coded</h1>
    <p>Thank you. You can close this page.</p>
  </section>
</main>

<script>
// ============ EDIT THIS BLOCK ============
const CONFIG = {
  question: "Is the image below left-wing, agnostic, or right-wing?",
  options: ["Left-wing", "Agnostic", "Right-wing"],
  appsScriptUrl: "https://script.google.com/macros/s/AKfycbwK6nAL2SePv265bO_3NIFB9fMLGM-NkaMtwwwBqJZTQCbjG5keifGxRZ_nJo0NL8vJ/exec",
  repeats: 0,        // number of images shown a second time (intra-coder reliability), e.g. 30
  allowBack: false,  // true lets coders revisit and re-answer earlier images
  ext: "png"
};
// =========================================

const $ = id => document.getElementById(id);
let coder, seq, done, pos, choice, shownAt;

// Seeded RNG so the same coder ID always gets the same order
function seed(str) { let h = 1779033703 ^ str.length; for (const c of str) { h = Math.imul(h ^ c.charCodeAt(0), 3432918353); h = h << 13 | h >>> 19; } return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^= h >>> 16) >>> 0; }; }
function rng(str) { const s = seed(str); let a = s(); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

function buildSequence(ids) {
  const r = rng("order:" + coder);
  const order = shuffle(ids.slice(), r);
  const s = order.map(id => ({ id, rep: 0 }));
  const firstHalf = order.slice(0, Math.floor(order.length / 2));
  shuffle(firstHalf.slice(), r).slice(0, CONFIG.repeats).forEach(id => {
    const at = Math.floor(s.length / 2) + Math.floor(r() * (s.length / 2));
    s.splice(at, 0, { id, rep: 1 });
  });
  return s;
}

const store = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let flushing = false, again = false;
async function flush() {
  if (flushing) { again = true; return; }   // one sender at a time, so nothing is sent twice
  flushing = true;
  try {
    do {
      again = false;
      for (const row of (store.get("pending:" + coder) || [])) {
        try { await fetch(CONFIG.appsScriptUrl, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(row) }); }
        catch { break; }
        // remove only the row just sent, re-reading the queue in case new answers were added meanwhile
        store.set("pending:" + coder, (store.get("pending:" + coder) || []).filter(r => r.uid !== row.uid));
      }
    } while (again);
  } finally { flushing = false; }
  const left = (store.get("pending:" + coder) || []).length;
  $("sync").textContent = left ? "Offline: " + left + " answer(s) will be sent when you reconnect" : "";
}

async function start() {
  coder = $("coder").value.trim();
  if (!coder) return;
  $("start").disabled = true; $("loginErr").textContent = "Loading…";
  try {
    const ids = await (await fetch("images.json")).json();
    seq = buildSequence(ids);
  } catch { $("loginErr").textContent = "Could not load images. Check your connection and try again."; $("start").disabled = false; return; }

  done = store.get("done:" + coder) || {};
  try { // merge anything already saved in the sheet (resume on another device)
    const remote = await (await fetch(CONFIG.appsScriptUrl + "?coder=" + encodeURIComponent(coder))).json();
    remote.forEach(p => { if (!(p in done)) done[p] = "(saved)"; });
  } catch {}
  pos = seq.findIndex((_, i) => !(i in done));
  $("login").hidden = true;
  flush();
  pos === -1 ? finish() : show(pos);
}

function show(i) {
  pos = i; choice = null;
  $("task").hidden = false;
  $("q").textContent = CONFIG.question;
  const opts = $("opts"); opts.innerHTML = "";
  CONFIG.options.forEach((label, n) => {
    const b = document.createElement("button");
    b.className = "opt"; b.setAttribute("aria-pressed", "false");
    b.innerHTML = "<kbd>" + (n + 1) + "</kbd>"; b.append(label);
    b.onclick = () => pick(label);
    opts.append(b);
  });
  $("next").disabled = true;
  $("back").hidden = !(CONFIG.allowBack && i > 0);
  $("count").textContent = "Image " + (i + 1) + " of " + seq.length;
  $("fill").style.width = (i / seq.length * 100) + "%";
  const img = $("img"); $("imgErr").hidden = true;
  img.onload = () => { shownAt = Date.now(); };
  img.onerror = () => { $("imgErr").hidden = false; $("imgErr").textContent = "Image failed to load: " + img.getAttribute("src"); };
  img.src = "images/" + seq[i].id + "." + CONFIG.ext;
  if (seq[i + 1]) new Image().src = "images/" + seq[i + 1].id + "." + CONFIG.ext;
  window.scrollTo(0, 0);
}

function pick(label) {
  choice = label;
  [...$("opts").children].forEach((b, n) => b.setAttribute("aria-pressed", CONFIG.options[n] === label));
  $("next").disabled = false;
}

function submit() {
  if (!choice) return;
  const row = { uid: coder + ":" + pos + ":" + Date.now(), coder, position: pos, image: seq[pos].id, repeat: seq[pos].rep, response: choice, seconds: Math.round((Date.now() - (shownAt || Date.now())) / 100) / 10 };
  done[pos] = choice; store.set("done:" + coder, done);
  store.set("pending:" + coder, (store.get("pending:" + coder) || []).concat(row));
  flush();
  const nxt = seq.findIndex((_, i) => i > pos && !(i in done));
  nxt === -1 ? finish() : show(nxt);
}

function finish() { $("task").hidden = true; $("done").hidden = false; }

$("start").onclick = start;
$("coder").onkeydown = e => { if (e.key === "Enter") start(); };
$("next").onclick = submit;
$("back").onclick = () => show(pos - 1);
document.onkeydown = e => {
  if ($("task").hidden || e.target.tagName === "INPUT") return;
  if (e.key >= "1" && e.key <= String(CONFIG.options.length)) pick(CONFIG.options[+e.key - 1]);
  if (e.key === "Enter" && choice) submit();
};
window.addEventListener("online", () => coder && flush());
</script>
</body>
</html>
